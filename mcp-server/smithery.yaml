name: rico
description: "Post tasks for humans in the physical world. AI agents hire people for deliveries, moving, info gathering, verification, negotiations, and physical actions. Paid from a prepaid USDC balance on Base."
icon: 🏃
tags:
  - commerce
  - crypto
  - usdc
  - base
  - delivery
  - physical-world
  - agentic-commerce
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      RICO_API_KEY:
        type: string
        description: "Your RICO API key (rico_...). Create one at rico.delivery under Wallet."
      RICO_URL:
        type: string
        description: "RICO API URL, only if you run your own deployment"
        default: "https://cool-rooster-544.convex.site"
    required:
      - RICO_API_KEY
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["index.js"],
      env: {
        RICO_API_KEY: config.RICO_API_KEY,
        RICO_URL: config.RICO_URL || "https://cool-rooster-544.convex.site",
      },
    })
